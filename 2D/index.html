<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<link href="styles.css" rel="stylesheet">
	<title>Toys</title>
</head>
<body>
<div class="wrapper">
	<div class="collection-box"></div>
	<div class="claw-machine">
		<div class="box">
			<div class="machine-top">
				<div class="arm-joint pix">
					<div class="arm pix">
						<div class="claws pix"></div>
					</div>
				</div>
				<div class="rail hori pix"></div>
				<div class="rail vert pix"></div>
			</div>
			<div class="machine-bottom">
				<div class="slot"></div>
			</div>
		</div>
		<div class="control">
			<div class="slot slot-lg"></div>
			<div class="buttons">
				<button aria-label="Move claw horizontally" class="hori-btn"></button>
				<button aria-label="Move claw vertically" class="vert-btn"></button>
				<button aria-label="Auto collect toy" class="auto-btn" title="Auto Collect Toy"></button>
			</div>
		</div>
	</div>
</div>
<!--<script src="index.js" type="module"></script>-->
</body>
</html>
